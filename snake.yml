# ─────────────────────────────────────────────────────────────────
#  Generate Contribution Snake
#  Runs every day + manually → draws your contribution history as
#  an animated snake into assets/github-snake.svg and commits it.
# ─────────────────────────────────────────────────────────────────

name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'        # every day at 00:00 UTC
  workflow_dispatch:            # also runnable manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate the snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Yogesh2201
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit the updated snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update contribution snake'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
